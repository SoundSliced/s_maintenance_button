name: s_maintenance_button
description: A Flutter widget that provides a visual maintenance mode indicator button with animated glow effect. Only visible in debug/profile modes.
version: 2.0.0
homepage: https://github.com/SoundSliced/s_maintenance_button
repository: https://github.com/SoundSliced/s_maintenance_button
issue_tracker: https://github.com/SoundSliced/s_maintenance_button/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  s_packages: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
